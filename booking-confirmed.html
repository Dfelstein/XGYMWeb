<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmed — XGYM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0a0a'/%3E%3Ctext y='.9em' font-size='80' x='10' fill='%23c9a84c' font-family='Arial Black,sans-serif' font-weight='900'%3EX%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9C1JQLR151"></script>
  <script src="analytics.js"></script>
  <style>
    :root {
      --black: #0a0a0a;
      --white: #f5f2ec;
      --gold: #c9a84c;
      --gold-light: #e8c96a;
      --green: #39e07a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { font-family: 'Barlow', sans-serif; background: var(--black); color: var(--white); line-height: 1.6; min-height: 100vh; }

    nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 3rem; background: rgba(10,10,10,0.97); border-bottom: 1px solid rgba(255,255,255,0.07); backdrop-filter: blur(10px); }
    .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 0.15em; color: var(--white); text-decoration: none; }
    .nav-logo span { color: var(--gold); }

    .page { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 72px); padding: 4rem 2rem; }

    .card {
      background: #0f0f0f;
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 8px;
      padding: 4rem 3rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .check {
      width: 64px; height: 64px;
      background: rgba(57,224,122,0.12);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 2rem;
      font-size: 1.8rem;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      color: var(--white);
    }
    h1 span { color: var(--gold); }

    .subtitle {
      font-size: 1.05rem;
      color: rgba(245,242,236,0.7);
      font-weight: 300;
      margin-bottom: 2.5rem;
      line-height: 1.8;
    }

    .reschedule-note {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 1.2rem 1.5rem;
      font-size: 0.9rem;
      color: rgba(245,242,236,0.55);
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
    .reschedule-note strong { color: rgba(245,242,236,0.8); }

    .actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

    .btn-gold {
      background: var(--gold);
      color: var(--black);
      padding: 0.85rem 2rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s;
      border-radius: 2px;
    }
    .btn-gold:hover { background: var(--gold-light); }

    .btn-outline {
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--white);
      padding: 0.85rem 2rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 700;
      text-decoration: none;
      transition: border-color 0.2s;
      border-radius: 2px;
    }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

    @media(max-width: 600px) {
      nav { padding: 1rem 1.5rem; }
      .card { padding: 2.5rem 1.5rem; }
      h1 { font-size: 2.2rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo"><span>X</span>GYM</a>
</nav>

<div class="page">
  <div class="card">
    <div class="check">✓</div>
    <h1>You're <span>Booked</span></h1>
    <p class="subtitle">Your appointment is confirmed. A confirmation email with all the details is on its way to you now.</p>

    <div class="reschedule-note">
      <strong>Need to reschedule?</strong> Check your confirmation email — it contains a direct link to change or cancel your appointment.
    </div>

    <div class="actions">
      <a href="testing.html" class="btn-gold">View All Tests</a>
      <a href="index.html" class="btn-outline">Back to Home</a>
    </div>
  </div>
</div>

<script>
// Fire GA4 + Meta conversion events on page load
window.addEventListener('load', function(){
  if(typeof gtag !== 'undefined'){
    gtag('event', 'booking_confirmed', { currency: 'AUD' });
  }
  if(typeof fbq !== 'undefined'){
    fbq('track', 'Purchase', { currency: 'AUD' });
  }
});
</script>

</body>
</html>
